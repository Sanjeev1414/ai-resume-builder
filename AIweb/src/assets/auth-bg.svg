<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#151a46"/>
      <stop offset="1" stop-color="#1e1250"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1600" height="1000" fill="url(#gridFade)"/></mask>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Base + aurora glows -->
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#blur)" opacity="0.85">
    <circle cx="260" cy="180" r="260" fill="#6366f1"/>
    <circle cx="1380" cy="240" r="240" fill="#a855f7"/>
    <circle cx="1250" cy="900" r="280" fill="#2563eb"/>
    <circle cx="220" cy="880" r="220" fill="#ec4899" opacity="0.6"/>
    <circle cx="800" cy="520" r="200" fill="#14b8a6" opacity="0.35"/>
  </g>
  <rect width="1600" height="1000" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Floating resume card (top left) -->
  <g transform="translate(150 230) rotate(-10)" filter="url(#softShadow)" opacity="0.92">
    <rect width="220" height="280" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="44" cy="46" r="20" fill="#a5b4fc" fill-opacity="0.8"/>
    <rect x="76" y="34" width="110" height="10" rx="5" fill="#fff" fill-opacity="0.85"/>
    <rect x="76" y="52" width="72" height="8" rx="4" fill="#fff" fill-opacity="0.4"/>
    <rect x="24" y="92" width="60" height="8" rx="4" fill="#818cf8"/>
    <rect x="24" y="110" width="172" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
    <rect x="24" y="125" width="150" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
    <rect x="24" y="140" width="162" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
    <rect x="24" y="172" width="70" height="8" rx="4" fill="#818cf8"/>
    <rect x="24" y="190" width="172" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
    <rect x="24" y="205" width="130" height="7" rx="3.5" fill="#fff" fill-opacity="0.3"/>
    <rect x="24" y="236" width="52" height="20" rx="10" fill="#34d399" fill-opacity="0.35"/>
    <rect x="82" y="236" width="62" height="20" rx="10" fill="#34d399" fill-opacity="0.35"/>
  </g>

  <!-- Score card (top right) -->
  <g transform="translate(1250 150) rotate(8)" filter="url(#softShadow)" opacity="0.95">
    <rect width="190" height="190" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
    <circle cx="95" cy="88" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="12"/>
    <circle cx="95" cy="88" r="50" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="314" stroke-dashoffset="50" transform="rotate(-90 95 88)"/>
    <text x="95" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff">84</text>
    <rect x="45" y="154" width="100" height="16" rx="8" fill="#34d399" fill-opacity="0.4"/>
  </g>

  <!-- Target companies (bottom left) -->
  <g transform="translate(150 700) rotate(5)" filter="url(#softShadow)" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="4" y="-14" font-size="13" font-weight="600" letter-spacing="2" fill="#c7d2fe" fill-opacity="0.8">DREAM COMPANIES</text>
    <rect width="118" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="59" y="27" text-anchor="middle" fill="#ffffff">Google</text>
    <rect x="128" width="124" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="190" y="27" text-anchor="middle" fill="#ffffff">Amazon</text>
    <rect x="262" width="138" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="331" y="27" text-anchor="middle" fill="#ffffff">Microsoft</text>
    <rect x="30" y="54" width="104" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="82" y="81" text-anchor="middle" fill="#ffffff">Infosys</text>
    <rect x="144" y="54" width="90" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="189" y="81" text-anchor="middle" fill="#ffffff">TCS</text>
    <rect x="244" y="54" width="112" height="42" rx="21" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="300" y="81" text-anchor="middle" fill="#ffffff">Flipkart</text>
  </g>

  <!-- Target roles (left middle) -->
  <g transform="translate(70 560) rotate(-4)" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">
    <rect width="84" height="36" rx="18" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="42" y="24" text-anchor="middle" fill="#a7f3d0">SDE</text>
    <rect x="94" width="150" height="36" rx="18" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="169" y="24" text-anchor="middle" fill="#c7d2fe">Data Engineer</text>
  </g>
  <g transform="translate(1270 560) rotate(5)" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">
    <rect width="140" height="36" rx="18" fill="#f472b6" fill-opacity="0.22" stroke="#f472b6" stroke-opacity="0.55"/>
    <text x="70" y="24" text-anchor="middle" fill="#fbcfe8">ML Engineer</text>
    <rect x="-30" y="46" width="170" height="36" rx="18" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text x="55" y="70" text-anchor="middle" fill="#fde68a">Product Manager</text>
    <rect x="150" y="46" width="130" height="36" rx="18" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="215" y="70" text-anchor="middle" fill="#bae6fd">Full Stack</text>
  </g>

  <!-- Improved bullet card (bottom right) -->
  <g transform="translate(1180 690) rotate(-6)" filter="url(#softShadow)" opacity="0.95">
    <rect width="270" height="150" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="22" y="22" width="56" height="10" rx="5" fill="#f87171" fill-opacity="0.8"/>
    <rect x="22" y="42" width="200" height="8" rx="4" fill="#fff" fill-opacity="0.3"/>
    <rect x="22" y="78" width="56" height="10" rx="5" fill="#34d399"/>
    <rect x="22" y="98" width="226" height="8" rx="4" fill="#fff" fill-opacity="0.75"/>
    <rect x="22" y="114" width="180" height="8" rx="4" fill="#fff" fill-opacity="0.75"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M560 140l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity="0.7"/>
    <path d="M1060 110l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity="0.5"/>
    <path d="M1480 560l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity="0.6"/>
    <path d="M60 470l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" opacity="0.5"/>
    <path d="M640 900l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity="0.5"/>
    <circle cx="980" cy="880" r="3" opacity="0.6"/>
    <circle cx="420" cy="80" r="2.5" opacity="0.6"/>
    <circle cx="1530" cy="400" r="2.5" opacity="0.5"/>
    <circle cx="70" cy="380" r="3" opacity="0.4"/>
  </g>
</svg>
