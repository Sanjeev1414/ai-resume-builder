name: Backend tests

on:
  push:
    branches: [main]
    paths: ['AIAPI/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['AIAPI/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test
