spring.application.name=resume-analyzer

# Load private settings (GEMINI_API_KEY, JWT_SECRET, MAIL_*) from AIAPI/.env if it exists.
# .env is git-ignored - copy .env.example to .env and fill it in.
spring.config.import=optional:file:.env[.properties]
# Hosting platforms like Render set PORT; locally it's 8080
server.port=${PORT:8080}

# Resume uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Google Gemini (key from the GEMINI_API_KEY environment variable) ---
# Free key: https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# --- Online compiler for the Interview Preparation pages (free, no key) ---
compiler.base-url=${COMPILER_BASE_URL:https://wandbox.org}

# --- Database ---
# Default: H2 file database in ./data (no setup needed).
# MySQL: run with the "mysql" profile (application-mysql.properties).
# PostgreSQL (used in production on Render): the "postgres" profile (application-postgres.properties).
# Tables are created/updated automatically; database/schema.sql has the same schema as plain SQL.
spring.datasource.url=jdbc:h2:file:./data/resume-analyzer
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Security ---
# Secret used to sign login tokens (at least 32 characters). Set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-hours=24

# --- Email (Gmail SMTP by default; leave MAIL_USERNAME empty to turn email off) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Public address of the web app (used in password reset links)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Frontend origin allowed to call this API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Rate limits ---
# Analyses each user may run per hour (protects the Gemini free-tier quota)
app.rate-limit.analyses-per-hour=10

# Don't leak stack traces or internal messages in error responses
server.error.include-message=never
server.error.include-stacktrace=never
