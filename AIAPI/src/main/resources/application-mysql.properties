# MySQL profile - activate with:  $env:SPRING_PROFILES_ACTIVE = "mysql"
# The database "resume_analyzer" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/resume_analyzer?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
