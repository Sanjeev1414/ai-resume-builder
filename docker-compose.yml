# Runs the whole stack: MySQL + AIAPI (Spring Boot) + AIweb (React on nginx).
# 1. Copy .env.example to .env and fill in the values
# 2. docker compose up --build
# 3. Open http://localhost:3000
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: resume_analyzer
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  aiapi:
    build: ./AIAPI
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Trust X-Forwarded-For from the nginx container so rate limits see real client IPs
      SERVER_FORWARD_HEADERS_STRATEGY: native

  aiweb:
    build: ./AIweb
    depends_on:
      - aiapi
    ports:
      - "3000:80"

volumes:
  mysql-data:
